    const ITERATIONS = 250000;

    function b64ToBytes(b64){
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    document.getElementById('gate').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('pw').value;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';
      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBytes(IV_B64) }, key, b64ToBytes(CIPHER_B64)
        );
        const html = new TextDecoder().decode(plainBuf);
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        errEl.style.display = 'block';
      }
    });
  </script>
